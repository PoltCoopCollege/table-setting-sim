<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Симулятор сервірування столів</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const ITEMS = [
      { id: 'dinner-plate', name: 'Обідня тарілка', category: 'plates', icon: '🍽️', desc: 'Основна тарілка для гарячих страв.' },
      { id: 'soup-bowl', name: 'Супова піала', category: 'plates', icon: '🥣', desc: 'Розміщується зверху на закусочну або обідню тарілку.' },
      { id: 'salad-plate', name: 'Закусочна тарілка', category: 'plates', icon: '🥗', desc: 'Використовується для салату або холодних закусок.' },
      { id: 'dinner-fork', name: 'Столова виделка', category: 'cutlery', icon: '🍴', desc: 'Кладеться ліворуч від тарілки зубцями догори.' },
      { id: 'salad-fork', name: 'Виделка для салату', category: 'cutlery', icon: '🍴', desc: 'Менша за розміром, кладеться лівіше столової.' },
      { id: 'dinner-knife', name: 'Столовий ніж', category: 'cutlery', icon: '🔪', desc: 'Кладеться праворуч від тарілки лезом до тарілки.' },
      { id: 'soup-spoon', name: 'Столова ложка', category: 'cutlery', icon: '🥄', desc: 'Кладеться праворуч від ножа для перших страв.' },
      { id: 'water-glass', name: 'Келих для води', category: 'glasses', icon: '🥛', desc: 'Стоїть зверху праворуч над кінчиком ножа.' },
      { id: 'wine-glass', name: 'Келих для вина', category: 'glasses', icon: '🍷', desc: 'Стоїть правіше або трохи вище келиха для води.' },
      { id: 'napkin', name: 'Тканинна серветка', category: 'other', icon: '🧻', desc: 'Кладеться ліворуч від виделок або на тарілку.' }
    ];

    const SCENARIOS = {
      breakfast: {
        title: 'Сніданок',
        required: ['salad-plate', 'dinner-fork', 'dinner-knife', 'water-glass', 'napkin'],
        hint: 'Необхідні: закусочна тарілка, виделка, ніж, келих для води та серветка.'
      },
      dinner: {
        title: 'Обід / Вечеря',
        required: ['dinner-plate', 'soup-bowl', 'dinner-fork', 'dinner-knife', 'soup-spoon', 'water-glass', 'wine-glass', 'napkin'],
        hint: 'Повний набір: обідня тарілка, супова піала, виделка, ніж, ложка, обидва келихи та серветка.'
      }
    };

    function App() {
      const [scenario, setScenario] = useState('dinner');
      const [tableState, setTableState] = useState({});
      const [selectedItem, setSelectedItem] = useState(null);
      const [feedback, setFeedback] = useState(null);

      const zones = [
        { id: 'left-outer', name: 'Ліворуч (зовнішня)', type: 'cutlery' },
        { id: 'left-inner', name: 'Ліворуч (внутрішня)', type: 'cutlery' },
        { id: 'center-bottom', name: 'Центр (базова тарілка)', type: 'plates' },
        { id: 'center-top', name: 'Центр (верхня тарілка)', type: 'plates' },
        { id: 'right-inner', name: 'Праворуч (внутрішня)', type: 'cutlery' },
        { id: 'right-outer', name: 'Праворуч (зовнішня)', type: 'cutlery' },
        { id: 'top-right-1', name: 'Зверху праворуч (основний келих)', type: 'glasses' },
        { id: 'top-right-2', name: 'Зверху праворуч (додатковий келих)', type: 'glasses' }
      ];

      const handlePlace = (zoneId) => {
        if (!selectedItem) return;
        setTableState(prev => ({ ...prev, [zoneId]: selectedItem }));
        setSelectedItem(null);
      };

      const handleClear = () => {
        setTableState({});
        setFeedback(null);
      };

      const checkRules = () => {
        const currentReqs = SCENARIOS[scenario].required;
        const placedItemIds = Object.values(tableState).map(item => item.id);
        
        const missing = currentReqs.filter(id => !placedItemIds.includes(id));
        const score = Math.round(((currentReqs.length - missing.length) / currentReqs.length) * 100);

        setFeedback({
          score,
          isSuccess: missing.length === 0,
          message: missing.length === 0 
            ? 'Чудово! Стіл сервіровано повністю правильно.' 
            : `Не вистачає елементів: ${missing.map(id => ITEMS.find(i => i.id === id)?.name).join(', ')}.`
        });
      };

      return (
        <div class="max-w-6xl mx-auto p-6 space-y-6">
          <header class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-amber-400">🍽️ Симулятор сервірування столів</h1>
            <p class="text-slate-400">Оберіть предмет та натисніть на відповідну зону на столі</p>
          </header>

          {/* Вибір режиму */}
          <div class="flex justify-center gap-4">
            {Object.entries(SCENARIOS).map(([key, sc]) => (
              <button
                key={key}
                onClick={() => { setScenario(key); handleClear(); }}
                class={`px-4 py-2 rounded-lg font-medium transition ${scenario === key ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
              >
                {sc.title}
              </button>
            ))}
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Панель предметів */}
            <div class="bg-slate-800 p-4 rounded-xl space-y-3">
              <h2 class="font-semibold text-lg border-b border-slate-700 pb-2">Посуд та прибори</h2>
              <div class="grid grid-cols-1 gap-2">
                {ITEMS.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setSelectedItem(item)}
                    class={`flex items-center gap-3 p-2 rounded-lg text-left transition border ${selectedItem?.id === item.id ? 'bg-amber-500/20 border-amber-500 text-amber-300' : 'bg-slate-900 border-slate-700 hover:border-slate-500'}`}
                  >
                    <span class="text-2xl">{item.icon}</span>
                    <div>
                      <div class="font-medium">{item.name}</div>
                      <div class="text-xs text-slate-400">{item.desc}</div>
                    </div>
                  </button>
                ))}
              </div>
            </div>

            {/* Стіл для сервірування */}
            <div class="md:col-span-2 bg-slate-800 p-6 rounded-xl flex flex-col items-center justify-between min-h-[450px]">
              <div class="w-full text-center text-xs text-amber-400 bg-amber-500/10 p-2 rounded border border-amber-500/20">
                {SCENARIOS[scenario].hint}
              </div>

              {/* Інтерактивна зона столу */}
              <div class="relative w-full max-w-md h-80 bg-amber-950/20 border-4 border-amber-900/40 rounded-3xl p-4 flex items-center justify-center">
                <div class="grid grid-cols-3 gap-4 w-full h-full items-center text-center">
                  
                  {/* Ліва сторона */}
                  <div class="flex flex-col gap-2">
                    <div onClick={() => handlePlace('left-outer')} class="h-20 border-2 border-dashed border-slate-600 rounded-lg flex items-center justify-center cursor-pointer hover:border-amber-400">
                      {tableState['left-outer'] ? `${tableState['left-outer'].icon} ${tableState['left-outer'].name}` : 'Зовнішня'}
                    </div>
                    <div onClick={() => handlePlace('left-inner')} class="h-20 border-2 border-dashed border-slate-600 rounded-lg flex items-center justify-center cursor-pointer hover:border-amber-400">
                      {tableState['left-inner'] ? `${tableState['left-inner'].icon} ${tableState['left-inner'].name}` : 'Внутрішня'}
                    </div>
                  </div>

                  {/* Центр */}
                  <div class="flex flex-col gap-2">
                    <div onClick={() => handlePlace('top-right-1')} class="h-12 border-2 border-dashed border-slate-600 rounded-lg flex items-center justify-center cursor-pointer hover:border-amber-400 text-xs">
                      {tableState['top-right-1'] ? `${tableState['top-right-1'].icon}` : 'Келих 1'}
                    </div>
                    <div onClick={() => handlePlace('center-bottom')} class="h-28 border-2 border-dashed border-slate-600 rounded-full flex items-center justify-center cursor-pointer hover:border-amber-400">
                      {tableState['center-bottom'] ? `${tableState['center-bottom'].icon} ${tableState['center-bottom'].name}` : 'Тарілка'}
                    </div>
                  </div>

                  {/* Права сторона */}
                  <div class="flex flex-col gap-2">
                    <div onClick={() => handlePlace('top-right-2')} class="h-12 border-2 border-dashed border-slate-600 rounded-lg flex items-center justify-center cursor-pointer hover:border-amber-400 text-xs">
                      {tableState['top-right-2'] ? `${tableState['top-right-2'].icon}` : 'Келих 2'}
                    </div>
                    <div onClick={() => handlePlace('right-inner')} class="h-16 border-2 border-dashed border-slate-600 rounded-lg flex items-center justify-center cursor-pointer hover:border-amber-400">
                      {tableState['right-inner'] ? `${tableState['right-inner'].icon} ${tableState['right-inner'].name}` : 'Внутрішня'}
                    </div>
                    <div onClick={() => handlePlace('right-outer')} class="h-16 border-2 border-dashed border-slate-600 rounded-lg flex items-center justify-center cursor-pointer hover:border-amber-400">
                      {tableState['right-outer'] ? `${tableState['right-outer'].icon} ${tableState['right-outer'].name}` : 'Зовнішня'}
                    </div>
                  </div>

                </div>
              </div>

              {/* Управління */}
              <div class="flex gap-4 w-full justify-center pt-4">
                <button onClick={checkRules} class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-medium transition">
                  Перевірити
                </button>
                <button onClick={handleClear} class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-6 py-2 rounded-lg font-medium transition">
                  Очистити
                </button>
              </div>

              {/* Результат */}
              {feedback && (
                <div class={`w-full mt-4 p-4 rounded-lg border text-center ${feedback.isSuccess ? 'bg-emerald-500/10 border-emerald-500 text-emerald-300' : 'bg-rose-500/10 border-rose-500 text-rose-300'}`}>
                  <div class="font-bold text-lg">Точність: {feedback.score}%</div>
                  <div>{feedback.message}</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
